# The domain. Depends on nothing, by design — see `docs/architecture.md` §1.
#
# `publish = false` on this and its two siblings is deliberate: they are
# internal to the workspace, and a crate nobody can depend on cannot be
# depended on by mistake.

[package]
name = "stageman-core"
description = "Domain types for stageman. Internal to the workspace."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
jiff = { version = "0.2.35", features = ["serde"] }
mutants = "0.0.4"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
uuid = { version = "1.26.0", features = ["serde"] }

[dev-dependencies]
serde_json = "1.0.151"
