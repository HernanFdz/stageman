# The deciding. May name the domain and the agent contract — it runs an agent
# to think with, the same way a job runs one to work with. `stageman-job` is absent
# from the list below on purpose.

[package]
name = "stageman-foreman"
description = "Channel watching, judgement and job dispatch for stageman. Internal to the workspace."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# An attribute and nothing else — it compiles to nothing unless cargo-mutants
# is the one building. Needed because the function that runs a foreman's turn
# drives the runtime and is covered only by tests the gate cannot run.
mutants = "0.0.4"
stageman-agent.workspace = true
# A typed error, because this crate is a library and its failures cross a
# boundary — `docs/conventions.md` §3.
thiserror = "2.0.20"
stageman-core.workspace = true

[lints]
workspace = true
