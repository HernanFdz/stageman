# The doing. May name the domain and the agent contract — an agent is what a
# job supervises. `stageman-orchestrator` is absent from the list below on
# purpose.

[package]
name = "stageman-job"
description = "Workspace isolation, agent supervision and tool hosting for stageman. Internal to the workspace."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
stageman-agent = { version = "0.1.0", path = "../agent" }
stageman-core.workspace = true
thiserror = "2.0.20"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
