# The doing. May name the domain and the agent contract — an agent is what a
# job supervises. `stageman-foreman` is absent from the list below on
# purpose.

[package]
name = "stageman-job"
description = "Workspace isolation, agent supervision and tool hosting for stageman. Internal to the workspace."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
stageman-agent.workspace = true
stageman-core.workspace = true
thiserror = "2.0.20"
# An attribute and nothing else — it compiles to nothing unless cargo-mutants
# is the one building. Needed because the container-driving functions here are
# covered only by tests the gate cannot run.
mutants = "0.0.4"
# Deciding whether a job is still showing something means opening a connection
# to it and giving up quickly if nothing answers, which is a socket and a
# clock. Nothing else here reaches the network: an agent is a subprocess, and
# that belongs to the adapter.
tokio = { version = "1.53.1", features = ["net", "time"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
