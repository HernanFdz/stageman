# Scaffolded by quality 0.1.0-dev.
#
# Deliberately contains no logic. Every rule lives in the justfile, so CI and
# your machine run the identical thing and cannot drift apart — which is also
# what keeps the project forge-neutral: porting this to another CI system means
# rewriting the setup steps, never the checks.
#
# The toolchain is not selected here on purpose: rust-toolchain.toml pins the
# exact compiler and rustup honours it automatically.
#
# Hardening note: for a repo that accepts outside contributions, pin each action
# to a full commit SHA rather than a tag (`uses: actions/checkout@<sha>`), since
# a tag can be moved. Left as tags here because the correct SHAs have to be
# looked up when you decide to pin them, not guessed by a scaffolder.

name: gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job, because there is one gate. `just verify` is the bar — the same
  # recipe the pre-push hook runs — so a single required status check covers
  # everything, and nobody has to remember to add a second one to the ruleset
  # when a second job appears.
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Mutation testing diffs against a base commit, which needs history.
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-deny,cargo-mutants
      # Empty on a push, where `mutants` falls back to working the base out
      # itself. On a pull request this is what the branch is actually proposed
      # against, which is the diff worth mutating.
      - run: just verify "${{ github.event.pull_request.base.sha }}"

      # The tests `just check` deliberately cannot run, because it must work on
      # a machine that has only a toolchain — see docs/conventions.md §5. They
      # are ignored rather than absent so that they are counted as skipped
      # rather than invisible, and this is the thing that keeps them honest:
      # ignored tests nothing ever runs rot, and rotting tests are worse than
      # none because they read as coverage.
      #
      # What stays out is the set that needs a paid credential and reaches a
      # model. Those cannot run here and are run by hand with
      # `just image-session`, which is a real limit rather than an oversight.
      - run: just image
      - run: just image-handshake
