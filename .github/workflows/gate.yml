# Scaffolded by quality 0.1.0-dev.
#
# Deliberately contains no logic. Every rule lives in the justfile, so CI and
# your machine run the identical thing and cannot drift apart — which is also
# what keeps the project forge-neutral: porting this to another CI system means
# rewriting the setup steps, never the checks.
#
# The toolchain is not selected here on purpose: rust-toolchain.toml pins the
# exact compiler and rustup honours it automatically.
#
# Hardening note: for a repo that accepts outside contributions, pin each action
# to a full commit SHA rather than a tag (`uses: actions/checkout@<sha>`), since
# a tag can be moved. Left as tags here because the correct SHAs have to be
# looked up when you decide to pin them, not guessed by a scaffolder.

name: gate

# Pull requests only, and never a push to `main`. Two things make a second run
# there redundant rather than merely expensive.
#
# The gate's own ruleset requires branches to be up to date before merging, so
# a pull request is checked against exactly the content that lands — the
# classic failure where two independently-green branches merge into a broken
# `main` cannot happen here.
#
# And nothing reaches `main` except through a pull request. The ruleset
# requiring one is bypassable only in "for pull requests only" mode, which
# GitHub defines as *requiring* its actor to open one: it permits merging
# without an approval, never pushing directly. So there is no path to `main`
# that a run here does not already cover.
#
# What this does give up is noticing a newly published advisory on a quiet
# week, since `deps` asks a live database and only runs when something is
# proposed. A schedule would cover that better than a push trigger ever did,
# and is deliberately not added until somebody wants it.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job, because there is one gate. `just verify` is the bar — the same
  # recipe the pre-push hook runs — so a single required status check covers
  # everything, and nobody has to remember to add a second one to the ruleset
  # when a second job appears.
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Mutation testing diffs against a base commit, which needs history.
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-deny,cargo-mutants
      # Empty on a push, where `mutants` falls back to working the base out
      # itself. On a pull request this is what the branch is actually proposed
      # against, which is the diff worth mutating.
      # One step, because there is one bar. Since
      # docs/decisions/0023-the-container-runtime-is-discovered-once.md,
      # `verify` builds the image and runs the container tests itself — they
      # used to be two steps here because the gate had to run on a machine with
      # only a toolchain, and it no longer does. A runner has a container
      # runtime already installed, which is what makes this work unchanged.
      #
      # What stays out is the set that needs a paid credential and reaches a
      # model. Those cannot run here and are run by hand with
      # `just image-session`, which is a real limit rather than an oversight.
      - run: just verify "${{ github.event.pull_request.base.sha }}"
