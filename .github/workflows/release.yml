# Cutting a release — see docs/decisions/0039-a-release-is-a-tagged-binary.md
# and docs/decisions/0040-a-release-is-built-on-the-machine-it-is-for.md.
#
# **Pushing a tag does nothing.** This used to trigger on `push: tags`, and no
# longer does: a tag pushed by hand is now a silent no-op, which is worth
# knowing before you spend an afternoon wondering where your release went. The
# only way to cut one is the *Run workflow* button on this workflow's page.
#
# That inversion is deliberate. A tag has to name the commit that was actually
# built, and a tag pushed from a laptop can name anything; asking for a version
# here means the build settles what the tag will point at rather than being
# handed it.
#
# **This workflow does not create the tag, and that is not a design choice —
# it is what the platform allows.** A tag created here would be attributed to
# the GitHub Actions app, and the `creation` rule guarding `refs/tags/v*` can
# only be bypassed by an actor the repository can name. On a user-owned
# repository that app is not one: adding it is refused with "Actor GitHub
# Actions integration must be part of the ruleset source or owner
# organization".
#
# So the release is created as a draft naming a tag that does not exist yet,
# with the commit it was built from recorded as the target. Publishing it —
# which only you can do — is what creates the tag, at that commit. Measured
# rather than assumed: a draft release does not create its tag, only publishing
# does.
#
# Deliberately contains no logic that belongs elsewhere, for the reason
# gate.yml gives: `just release` derives the commit and its date and can be run
# by hand to reproduce exactly what this produces. What is here is what only
# the forge knows — which commit was asked for, and whether it is allowed.
#
# **Three jobs, and the split is load-bearing rather than tidy.** Settling runs
# alone so a mistyped version fails before any runner installs a toolchain.
# Building is one job per target, on a runner of that target's own platform,
# because a Linux runner cannot link for Darwin at any price. Drafting is one
# job because it is the only writer: two builds each attaching their own file
# to one release is a race whose failure mode is a published release quietly
# missing a platform.

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to cut, including the leading v — for example v0.2.0"
        required: true
        type: string
      commit:
        description: "Commit to build from. Leave blank for the head of main. Must be on main."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything that can be refused is refused here, before a single tool is
  # installed, so a mistyped version fails in seconds rather than after two
  # ten-minute builds.
  settle:
    name: settle
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.settle.outputs.version }}
      commit: ${{ steps.settle.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Always main, whatever was dispatched: what is released is decided
          # by the inputs below rather than by which branch the button was
          # pressed from. Full history, because an older commit has to be
          # reachable in order to be checked and built.
          ref: main
          fetch-depth: 0

      # Inputs arrive through the environment rather than being interpolated
      # into the script. `${{ }}` inside a `run:` is pasted in as text before
      # the shell sees it, so a version containing shell syntax would execute;
      # through the environment it is only ever data.
      - name: settle what is being released
        id: settle
        env:
          ASKED_VERSION: ${{ inputs.version }}
          ASKED_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail

          # The workflow file that runs is the one on the ref the button was
          # pressed from, while the code released is always main's. Dispatching
          # from a branch would therefore run that branch's recipe against
          # main's code, which is confusing in a way that only shows up when
          # something is already wrong.
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::dispatched from ${GITHUB_REF}, which is not main."
            echo "Releases are cut from main. Select main in the 'Use workflow from' dropdown." >&2
            exit 1
          fi

          # The leading `v` is not decoration. Both rulesets guarding release
          # tags match `refs/tags/v*`, so a tag named without it would be
          # unprotected — movable, and deletable by anybody. A typo would opt
          # the release out of every protection this repository has.
          case "${ASKED_VERSION}" in
            v[0-9]*) ;;
            *)
              echo "::error::'${ASKED_VERSION}' does not look like a version tag."
              echo "It must begin with v and a digit, as in v0.2.0. Tags outside refs/tags/v* are protected by nothing." >&2
              exit 1
              ;;
          esac

          if git rev-parse -q --verify "refs/tags/${ASKED_VERSION}" >/dev/null; then
            echo "::error::${ASKED_VERSION} already exists."
            echo "A tag never moves once cut. Choose the next version, or withdraw that one first." >&2
            exit 1
          fi

          # Existence and ancestry are two failures with two fixes, so they are
          # two messages. `merge-base --is-ancestor` does answer both at once —
          # it exits 128 on a commit that is not there and 1 on one that is not
          # on main — but only the second of those is silent, and git's own
          # `fatal:` reads like the workflow broke rather than like a typo.
          if [ -n "${ASKED_COMMIT}" ]; then
            if ! git cat-file -e "${ASKED_COMMIT}^{commit}" 2>/dev/null; then
              echo "::error::${ASKED_COMMIT} is not a commit in this repository."
              exit 1
            fi
            if ! git merge-base --is-ancestor "${ASKED_COMMIT}" origin/main; then
              echo "::error::${ASKED_COMMIT} is not on main."
              echo "A release is built from reviewed code. Merge it first." >&2
              exit 1
            fi
            building="$(git rev-parse "${ASKED_COMMIT}")"
          else
            building="$(git rev-parse origin/main)"
          fi

          {
            echo "version=${ASKED_VERSION}"
            echo "commit=${building}"
          } >> "$GITHUB_OUTPUT"
          echo "cutting ${ASKED_VERSION} from ${building}"

  # One job per target, each on a runner of that target's own platform. Nothing
  # here is cross-compiled: every target below is the host triple of the
  # machine building it, which is why no linker is configured and no target is
  # installed. See 0040.
  build:
    name: build ${{ matrix.target }}
    needs: settle
    runs-on: ${{ matrix.runner }}
    strategy:
      # The default, said out loud because it is the behaviour wanted: a target
      # that cannot be built must stop the release rather than produce most of
      # one. `draft` needs every build anyway, so this only decides how much
      # runner time is spent finding that out.
      fail-fast: true
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            # What the built file must actually be, as `file` spells it. See
            # the step that reads it.
            architecture: x86-64
          # `macos-latest` rather than a pinned image, which is the opposite of
          # what determinism usually asks for and is deliberate: runner images
          # are retired on GitHub's schedule, and that failure would land on
          # the one workflow whose breaking is most expensive to discover. What
          # a pin was protecting against is asserted directly below instead.
          - target: macos-arm64
            runner: macos-latest
            architecture: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # Detached on purpose: what is built is a commit, not a branch, and
      # `just release` reads the commit and its date from HEAD.
      - run: git checkout --detach ${{ needs.settle.outputs.commit }}

      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # Pinned to the `dioxus` dependency exactly, because `dx` generates the
      # glue the runtime hydrates against — docs/conventions.md §5. `binstall`
      # fetches a prebuilt where there is one and builds it where there is not.
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm --locked dioxus-cli@0.7.9

      - run: just release "${{ needs.settle.outputs.version }}" ${{ matrix.target }}

      # The name says which machine the file is for, and until here nothing has
      # checked that it is true. It is worth a step of its own because the
      # symptom of it being false is `Exec format error` on somebody else's
      # computer, days later, with nothing in the release saying which half was
      # wrong. `just build` already prints this line; asserting it is what
      # turns a printed fact into a refusal.
      - name: the file is for the machine it is named for
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          built="dist/stageman-${{ matrix.target }}"
          described="$(file -b "$built")"
          echo "$built: $described"
          case "$described" in
            *"${ARCHITECTURE}"*) ;;
            *)
              echo "::error::${built} is '${described}', which is not ${ARCHITECTURE}."
              echo "The runner is not the machine this target names. A release asset that lies about its architecture fails at exec time on somebody else's computer." >&2
              exit 1
              ;;
          esac

      # The executable bit does not survive an artifact — they are packed as
      # zips, which drop it — and that is fine rather than something to work
      # around: a release asset is not executable when downloaded either, which
      # is why `chmod +x` is in every set of instructions for one. Nothing
      # between here and the release needs to run it.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/stageman-${{ matrix.target }}
          if-no-files-found: error
          # Long enough to reach the job below and no longer. What is worth
          # keeping is attached to the release.
          retention-days: 1

  # The only writer. Everything built lands here and becomes one draft, so
  # there is no moment at which a release exists carrying some of its binaries.
  # `needs` names `settle` as well as `build`, which looks redundant because
  # `build` already waits for it — and for ordering it would be. It is not
  # ordering. `needs.<job>.outputs` resolves only for jobs this one lists
  # directly, and a transitive dependency is not one: drop `settle` here and
  # every `needs.settle.outputs.*` below silently becomes the empty string.
  # The tag name is one of them, and the release action falls back to the
  # current ref when handed nothing — so the result is a draft release for a
  # tag called `main`, outside the `refs/tags/v*` rulesets, which is precisely
  # the failure the settle job exists to prevent.
  draft:
    name: draft
    needs: [settle, build]
    runs-on: ubuntu-latest
    permissions:
      # For creating the release. Note this is *not* enough to create the tag,
      # and does not need to be — see the header.
      contents: write
    steps:
      # Checked out first, because `actions/checkout` clears the workspace and
      # would take the artifacts with it. At the settled commit rather than the
      # head of main: the script a release publishes has to be the one that was
      # reviewed alongside the binaries it installs.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - run: git checkout --detach ${{ needs.settle.outputs.commit }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # The version is substituted into the tracked template here, so the
      # published script installs *this* release's binaries rather than
      # whatever `latest` means when somebody runs it. The recipe asserts that
      # exactly one line changed, so this cannot quietly publish a template.
      # See docs/decisions/0041-installing-is-a-script-published-with-the-release.md.
      - run: just installer "${{ needs.settle.outputs.version }}"

      # `merge-multiple` flattens every artifact into one directory, which is
      # the layout the files below name. Each artifact holds exactly one file
      # and they are named for their targets, so nothing collides — including
      # with the script written into the same directory above.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # No copy and no rename: what `just build` produced is what ships, under
      # the name it already has.
      #
      # **The version is deliberately not in the filename.** It is in the tag
      # the asset hangs from and in the binary itself, which answers
      # `--version` without being started — so a third copy in the filename
      # would be a third place for it to disagree. What it buys is a URL that
      # does not change: `/releases/latest/download/stageman-linux-x64`
      # resolves for every release, where a versioned name can only ever be
      # written down after the fact.
      #
      # The cost is that two releases downloaded into one directory overwrite
      # each other. That is the trade being made: the file no longer says which
      # version it is, and the binary does.
      #
      # **No checksum is attached, deliberately** — 0040. One published beside
      # the binary comes from the same release over the same connection, so
      # anybody able to replace one could replace both, and GitHub already
      # records a digest per asset. A verification step that resembles a
      # security control without being one is worse than none.
      #
      # A draft, and the tag does not exist yet. Publishing is what creates it,
      # at the commit named here — so the tag can only ever point at what was
      # built, and only you can bring it into existence.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.settle.outputs.version }}
          target_commitish: ${{ needs.settle.outputs.commit }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/install.sh
            dist/stageman-linux-x64
            dist/stageman-macos-arm64
