# Scaffolded by quality 0.1.0-dev.
#
# Deliberately narrow. cargo-deny out of the box fails on your own path
# dependencies and your own unlicensed internal crates, which trains you to
# ignore its output — and a check you ignore is worse than no check, because
# it still reads as coverage.

[advisories]
# A yanked dependency is a decision someone else made about your code.
yanked = "deny"
# Add advisory IDs here ONLY with a dated comment saying why it does not
# apply and when it will be revisited. An unexplained entry is a silent hole.
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # The three below arrived with the dashboard's framework and are each
    # permissive. Listed one at a time rather than by widening the policy,
    # because the next one to appear should be a decision somebody takes.
    #
    # A public-domain dedication with a permissive fallback. Reaches this
    # through a hex encoder in the router's macro.
    "CC0-1.0",
    # A data licence rather than a code one, which is right for what carries it
    # here: a bundled set of certificate authority roots is data.
    "CDLA-Permissive-2.0",
    # The Boost licence: permissive, OSI-approved, and with no attribution
    # requirement for binaries.
    "BSL-1.0",
]
confidence-threshold = 0.9
# An allow-list entry no dependency happens to use is not a finding. Left at
# the default, a project with few dependencies gets one warning per unused
# entry on every single run — noise from the first commit, which is how a
# check becomes something you skim past instead of read.
unused-allowed-license = "allow"
# Workspace-internal crates are not published and need no license header.
# Without this, every path dependency is a finding.
private = { ignore = true }

[bans]
# Denied, with the exemptions written down. This was a warning on the argument
# that duplicates are upstream's fault and not actionable — true, and beside
# the point: a warning nobody acts on is how a duplicate gets *added* without
# anyone noticing, which is precisely how the entry below arrived. Denying
# makes a new duplicate fail the gate while the known ones carry a reason and a
# revisit trigger, which is the trade `#[expect(lint, reason = "…")]` already
# makes in the source.
#
# The self-deletion is not free: an exemption that stops matching reports as
# `unmatched-skip`, which is a warning here and is promoted to an error by the
# `deps` recipe. Without that flag a stale entry rots silently, which is the
# failure this whole section is trying to avoid.
multiple-versions = "deny"
# Empty, and it was not always. A `syn:2` entry lived here, because half the
# proc-macro ecosystem has moved to syn 3 and half has not. It is gone rather
# than resolved: the subtree below carries syn 2 as well, and a version skipped
# there is skipped everywhere — so the entry stopped matching anything and
# cargo-deny said so on every run. That is the masking cost named below,
# arriving on the very first commit that could demonstrate it.
skip = []

# One entry, and it is the honest shape of the problem rather than an escape
# from it. The dashboard's framework brings a tree of its own, and that tree
# contains twenty-eight crates at two versions — `windows-sys`, `getrandom`,
# `thiserror`, `rand` and the rest. Not one of them is a version this project
# picked, and no edit here resolves any of them: they are upstream's choices on
# upstream's release cadence.
#
# The alternative was twenty-eight `skip` entries, which is precisely what the
# note above says an exemption list must not become — at that length nobody
# reads it, and a real duplicate hides in the middle of it. So the subtree is
# exempt in one line that says why, and `multiple-versions = "deny"` keeps
# every one of its teeth everywhere this project actually chooses a dependency.
#
# What it costs: anything duplicated *inside* this subtree stops being reported
# outside it too, because cargo-deny skips the version rather than the edge.
# There is already one case — `syn` is at 2 and 3 across this workspace, the
# protocol SDK's derive being on 3 and six other proc-macro crates on 2, and
# nothing reports it now. That was a `skip` entry with its own reasoning until
# this line made it redundant. The trade is worth knowing before adding a
# dependency and trusting silence.
#
# Revisit: when the framework's own tree settles, or if this project ever needs
# to audit a specific duplicate inside it — narrow to named `skip` entries
# then, with the tree in front of you.
skip-tree = [
    { crate = "dioxus", depth = 20, reason = "the dashboard framework's own dependency tree, which this project does not choose versions in" },
]
# A wildcard version is not reproducible and not auditable.
wildcards = "deny"
# Exempts intra-workspace path dependencies, which carry no version and would
# otherwise be reported as wildcards in every workspace.
#
# IMPORTANT: this does NOT apply to publishable crates — crates.io forbids bare
# path dependencies, so a publishable crate depending on a sibling by path with
# no `version` cannot be published at all. If cargo-deny still reports a
# wildcard after enabling this, it has found a real publishability defect, not
# noise. The usual cause is a member declared `{ workspace = true }` where the
# workspace entry gives a path but no `version`; `cargo publish --dry-run`
# confirms it.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
