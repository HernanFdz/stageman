# The contract every coding agent is driven through, and the adapters that
# implement it. Depends on the domain and nothing else in this workspace.

[package]
name = "stageman-agent"
description = "The coding-agent contract and its adapters for stageman. Internal to the workspace."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
agent-client-protocol = "2.0.0"
futures = "0.3.34"
parking_lot = "0.12.5"
stageman-core.workspace = true
# An attribute and nothing else — it compiles to nothing unless cargo-mutants
# is the one building. Needed because the container-driving functions here are
# covered only by tests the gate cannot run.
mutants = "0.0.4"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["process", "io-util"] }
tokio-util = { version = "0.7.19", features = ["compat"] }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt", "time"] }
