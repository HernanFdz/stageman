[package]
name = "stageman"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "An orchestration platform for sleepless coding agents."
license = "MIT"
readme = "README.md"
repository = "https://github.com/HernanFdz/stageman"
keywords = ["agentic", "coding"]
categories = ["AI"]

[lints]
workspace = true

[workspace]
# xtask is a member so the gate lints its own implementation.
members = ["xtask"]

[profile.release]
# Debug builds already panic on integer overflow; release wraps silently.
# This makes the runtime behaviour uniform, and is the backstop for the
# overflow that clippy::arithmetic_side_effects only warns about statically.
overflow-checks = true

[workspace.lints.rust]
# Cannot be overridden anywhere, including in-source — so the escape is a
# visible manifest change rather than a buried #[allow]. That is the point.
unsafe_code = "forbid"
# A typo'd lint name is otherwise a silent no-op: unknown_lints is warn by
# default, so a maximal-looking config can contain entries that do nothing.
# This caught `clippy::unfulfilled_lint_expectations` (below) being filed
# under the wrong table on its very first run.
unknown_lints = "deny"
# A rustc lint, NOT a clippy one — it belongs here, not under lints.clippy.
# Makes a suppression FAIL once it is no longer needed, so exemptions
# self-delete instead of accumulating. This is what keeps a strict config
# from decaying into a wall of dead #[allow]s.
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Safe at "deny" ONLY because rust-toolchain.toml pins the compiler. Nursery
# lints are explicitly under development; against a floating toolchain a
# routine `rustup update` would break CI on code nobody touched.
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Fires once per duplicated version anywhere in the tree — almost always someone
# else's transitive choice, and nothing you can act on. deny.toml covers the same
# ground properly with `multiple-versions = "warn"`, which keeps it visible
# without making the gate lie. Left denied, this is the largest non-actionable
# noise source in the whole set.
multiple_crate_versions = "allow"

# DENY PANICS — each one verified firing on clippy 0.1.95.
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

# --- Everything below is warn-by-default and is NOT promoted by pedantic,
# --- nursery or cargo. Without these lines the config looks maximal and
# --- silently is not. All four were unset in every audited project.

# Otherwise the declared rust-version is decorative.
incompatible_msrv = "deny"
# Forces #[expect(lint, reason = "…")] over bare #[allow].
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Inert until clippy.toml defines entries, but must be denied to have teeth.
disallowed_methods = "deny"
disallowed_types = "deny"
