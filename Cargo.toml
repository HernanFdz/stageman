# A virtual manifest: every crate is a member and none is the root package.
# `docs/architecture.md` §1 names the four and says which way the dependencies
# point; this file is where that rule is actually enforced, because a member
# cannot name a crate it does not depend on.

[workspace]
members = ["core", "agent", "foreman", "job", "app", "xtask"]
# Must be explicit in a virtual manifest — there is no root package whose
# edition could imply it, and the default without this line is resolver 1.
resolver = "3"

[workspace.package]
# Meaningless on purpose, and refused on purpose. A release is a tagged binary
# and never a package — `docs/decisions/0039-a-release-is-a-tagged-binary.md` —
# so a number here would be a second place for a version to live and the only
# one nobody updates. What a binary reports comes from the tag it was built
# from; a build told nothing says so.
version = "0.0.0"
# The enforcement rather than the label. `cargo publish` refuses rather than
# this resting on nobody trying — which matters because a published package
# cannot carry the browser half, and would install a dashboard that renders and
# never responds.
publish = false
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
repository = "https://github.com/HernanFdz/stageman"

# The whole internal dependency graph in one place, so the shape is readable
# without opening five manifests. No version requirements: a path dependency
# needs one only in order to be published, and nothing here ever is.
#
# What is absent matters as much as what is here: neither `foreman` nor `job`
# may name the other, and the only thing stopping them is that no such
# dependency is ever declared.
[workspace.dependencies]
stageman-core = { path = "core" }
stageman-agent = { path = "agent" }
stageman-foreman = { path = "foreman" }
stageman-job = { path = "job" }

[profile.release]
# Debug builds already panic on integer overflow; release wraps silently.
# This makes the runtime behaviour uniform, and is the backstop for the
# overflow that clippy::arithmetic_side_effects only warns about statically.
overflow-checks = true
# Debug information, and not the symbol table. Measured on the shipped
# artefact: 32.4MB unstripped, 21.1MB without debug information, 17.4MB
# without symbols either.
#
# The last step is refused rather than overlooked. `overflow-checks` above
# makes a panic a *designed* failure here rather than only a bug — and this is
# a daemon on somebody else's machine, killed at three in the morning, where
# one log is all anybody gets. A panic names its own file and line whatever is
# stripped, because that is a static string rather than debug information; what
# a symbol table buys is the chain of calls that led there. Three and a half
# megabytes is a poor price for reading that chain once.
strip = "debuginfo"

[workspace.lints.rust]
# Cannot be overridden anywhere, including in-source — so the escape is a
# visible manifest change rather than a buried #[allow]. That is the point.
unsafe_code = "forbid"
# A typo'd lint name is otherwise a silent no-op: unknown_lints is warn by
# default, so a maximal-looking config can contain entries that do nothing.
# This caught `clippy::unfulfilled_lint_expectations` (below) being filed
# under the wrong table on its very first run.
unknown_lints = "deny"
# A rustc lint, NOT a clippy one — it belongs here, not under lints.clippy.
# Makes a suppression FAIL once it is no longer needed, so exemptions
# self-delete instead of accumulating. This is what keeps a strict config
# from decaying into a wall of dead #[allow]s.
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Safe at "deny" ONLY because rust-toolchain.toml pins the compiler. Nursery
# lints are explicitly under development; against a floating toolchain a
# routine `rustup update` would break CI on code nobody touched.
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Fires once per duplicated version anywhere in the tree, with no way to exempt
# one case without exempting them all. deny.toml covers the same ground properly
# with `multiple-versions = "deny"` plus a skip list, so each exemption carries
# its reason and fails the gate once it stops being needed. Left denied here,
# this is the largest non-actionable noise source in the whole set.
multiple_crate_versions = "allow"

# DENY PANICS — each one verified firing on clippy 0.1.95.
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

# --- Everything below is warn-by-default and is NOT promoted by pedantic,
# --- nursery or cargo. Without these lines the config looks maximal and
# --- silently is not. All four were unset in every audited project.

# Otherwise the declared rust-version is decorative.
incompatible_msrv = "deny"
# Forces #[expect(lint, reason = "…")] over bare #[allow].
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Inert until clippy.toml defines entries, but must be denied to have teeth.
disallowed_methods = "deny"
disallowed_types = "deny"
