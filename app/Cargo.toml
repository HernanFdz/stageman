# The one you run. It may name every internal crate; nothing may name it.
#
# **Not a published package**, per
# `docs/decisions/0039-a-release-is-a-tagged-binary.md` — a registry builds with
# `cargo` alone and so cannot carry the browser half, which would make an
# install a dashboard that renders and never responds. `publish = false` in the
# workspace is what refuses it.
#
# `README.md` and `LICENSE` here are symlinks to the files at the repository
# root, which packaging would have followed. They stay because the first is
# this crate's front page — every example in it is compiled as a doctest — and
# the second belongs beside the code whether or not anybody ships it.

[package]
name = "stageman"
description = "An orchestration platform for sleepless coding agents."
readme = "README.md"
version.workspace = true
# Inherited rather than repeated. Workspace inheritance is opt-in per field, so
# without this line the workspace's `publish = false` applies to everything
# except the one package anybody would try to publish — which is the shape of
# mistake that looks configured and is not. The internal crates declare it
# themselves and always have.
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# This crate is compiled twice, for two machines, and the features are how it
# is told which. `server` is the daemon: it operates the instance, so it names
# the internal crates and everything that touches a disk. `web` is the bundle
# served to a page, and names almost nothing.
#
# **Every server-side dependency is optional on purpose.** A `cfg` in the
# source does not stop cargo building a dependency — only the manifest does —
# so gating the code and leaving the dependency unconditional would compile
# `stageman-core`, and with it the credential types and the cipher, for the
# browser. That is the rule in
# `docs/decisions/0022-the-browser-never-sees-the-domain.md`, and this list is
# where it is actually enforced.
[features]
default = ["server"]
server = [
    "dep:parking_lot",
    "dep:rand",
    "dep:serde_json",
    "dep:stageman-agent",
    "dep:stageman-core",
    "dep:stageman-job",
    "dep:stageman-foreman",
    "dep:stageman-instance",
    "dep:stageman-world",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dioxus/fullstack",
    "dioxus/router",
    "dioxus/server",
]
web = ["dioxus/fullstack", "dioxus/router", "dioxus/web"]

[dependencies]
# Both halves. The renderer is selected by a feature above rather than here,
# which is why this line names no platform at all.
#
# Pinned exactly, to the version of `dx` installed on the machines that build
# the browser half. `dx` generates the glue this hydrates against, so the CLI
# and the library are one thing shipped as two packages and a mismatch is
# reported on every start — see `docs/conventions.md` §5. An ordinary caret
# requirement would let a routine `cargo update` walk away from whichever `dx`
# is installed, silently, which is the failure this is pinned to prevent.
# Raising it means installing the matching `dx`, which is a deliberate act on
# every machine that builds the browser half — and the other way round: a
# newer `dx` is what raises this.
dioxus = "=0.7.10"
# Both halves, and the reason the view has its own types: what crosses a server
# function has to serialise, and what the browser is handed must be nothing
# more than that.
serde = { version = "1.0.228", features = ["derive"] }
# Both halves: what crosses to a browser, as the instance builds it and the
# page reads it. The one internal crate the browser's half may name, because
# it names nothing — see `docs/architecture.md` §1.
stageman-wire = { workspace = true }
# Both halves. An error returned by a server function is matched on by the
# browser, so the type and its `Display` have to exist there too — which is
# what makes `docs/conventions.md` §3's typed-errors rule true on the wire
# rather than only inside the daemon.
thiserror = "2.0.20"
# An attribute and nothing else — it compiles to nothing unless cargo-mutants
# is the one building. Needed here for the browser's entry point, which no
# configuration the tests run under compiles at all.
mutants = "0.0.4"
# Icons, for both halves. Only the categories named here are compiled, and an
# icon outside them does not fail to draw — it fails to resolve, as a missing
# name. So an import that will not compile usually means a category to add
# rather than an icon that does not exist, and the crate's own source says
# which: each module carries the `cfg` listing every category it belongs to,
# and one icon is often in several.
#
# Not optional, unlike everything the daemon needs. An icon is drawn in the
# browser, which is the half that has no features beyond the framework.
# Icons are behind per-group features, and the groups are the smallest set
# covering what `app/src/ui/icon_ui.rs` draws — the one module that decides
# which icon means what, per `docs/conventions.md` §3. What a group costs is
# compile time rather than bundle size: a browser build strips every icon
# nothing draws.
lucide-dioxus = { version = "2.43.0", features = [
    "accessibility",
    "arrows",
    "development",
    "files",
    "multimedia",
    "notifications",
    "shapes",
    "text",
    "time",
    "tools",
] }

parking_lot = { version = "0.12.5", optional = true }
rand = { version = "0.10.2", optional = true }
serde_json = { version = "1.0.151", optional = true }
stageman-agent = { workspace = true, optional = true }
stageman-core = { workspace = true, optional = true }
stageman-job = { workspace = true, optional = true }
stageman-foreman = { workspace = true, optional = true }
stageman-instance = { workspace = true, optional = true }
# Both halves, like the wire crate and for the same reason: it names nothing
# but serialisation.
stageman-vocabulary = { workspace = true }
stageman-world = { workspace = true, optional = true }
tokio = { version = "1.53.1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "time",
], optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "fmt",
], optional = true }
tw_merge = "0.1"

[lints]
workspace = true

# Scoped to the machines that can run it. A dev-dependency is not optional-able,
# and `--all-targets` compiles the library's own test target for whatever is
# being built — so an unscoped `tempfile` would be built for the browser by the
# gate's wasm pass, for tests that are not compiled there.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tempfile = "3.27.0"
# For the example alone, which mints identifiers for a state it invents. The
# daemon mints nothing: every identifier it makes comes from the instance's
# seeded generator, which is the whole of
# `docs/decisions/0056-the-instance-decides-and-the-world-performs.md`.
uuid = { version = "1.26.0", features = ["v4"] }

# The example and the integration test state what the browser cannot build.
# `required-features` makes cargo skip a target rather than fail on it, so the
# wasm pass compiles what belongs there and says so, instead of needing a list
# of exclusions that would have to be maintained by hand.
#
# The binary is deliberately not in that list. `dx` builds the *same* binary
# for both halves, so a binary the browser cannot build is a client that cannot
# be built at all — its `main` is split by feature instead, and the gate's wasm
# pass compiles the entry point along with everything it reaches.

[[example]]
name = "propose"
path = "examples/propose.rs"
required-features = ["server"]

[[test]]
name = "starting"
path = "tests/starting.rs"
required-features = ["server"]
